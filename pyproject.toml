[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "inspiring-terminal"
version = "0.2.2"
authors = [
    { name="Marivaldo Pedro", email="marivaldo.pedro.dev@outlook.com" },
]
description = "Uma CLI que exibe citações inspiradoras no seu terminal."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "deep-translator>=1.11.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
]


[project.urls]
Homepage = "https://github.com/MarivaldoDev/inspiring_terminal"
Issues = "https://github.com/MarivaldoDev/inspiring_terminal/issues"


[project.scripts]
inspire = "inspire_term.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]
