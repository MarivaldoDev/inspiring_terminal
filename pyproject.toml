[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspiring-terminal"
version = "0.1.0"
description = "Display an inspiring quote every time you open your terminal."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "googletrans>=4.0.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
inspire = "inspire_term.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
